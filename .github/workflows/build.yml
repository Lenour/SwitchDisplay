name: Build SwitchDisplay

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: nuget restore SwitchDisplay.sln

      - name: Build Release
        run: msbuild SwitchDisplay.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Package as .pext
        shell: pwsh
        run: |
          $pextDir = "pext_staging"
          New-Item -ItemType Directory -Force -Path $pextDir | Out-Null

          # Find the actual output folder (may be bin\Release or bin\Release\net472)
          $outDir = "bin\Release"
          $netDir = Get-ChildItem $outDir -Directory | Select-Object -First 1
          if ($netDir) {
            Copy-Item "$($netDir.FullName)\*" $pextDir -Recurse -Force
          } else {
            Copy-Item "$outDir\*" $pextDir -Recurse -Force
          }

          # Copy required metadata to root
          Copy-Item "extension.yaml" $pextDir -Force
          Copy-Item "icon.png"       $pextDir -Force

          # NOTE: manifest.yaml is NOT included in the .pext
          # It is only used for the Playnite addon store, not for local installation

          # Copy Localization folder
          if (Test-Path "Localization") {
            Copy-Item "Localization" $pextDir -Recurse -Force
          }

          # Remove manifest.yaml if it was copied from bin output
          Remove-Item "$pextDir\manifest.yaml" -ErrorAction SilentlyContinue

          # Sanity checks
          if (-not (Test-Path "$pextDir\extension.yaml")) {
            Write-Error "extension.yaml not found at staging root!"; exit 1
          }
          if (-not (Test-Path "$pextDir\SwitchDisplay.dll")) {
            Write-Error "SwitchDisplay.dll not found at staging root!"; exit 1
          }

          Write-Host "=== Staging root contents ==="
          Get-ChildItem $pextDir | Select-Object Name

          # Zip contents so all files are at zip root
          $pextFile = "$PWD\SwitchDisplay.pext"
          Push-Location $pextDir
          Compress-Archive -Path ".\*" -DestinationPath $pextFile -Force
          Pop-Location
          Write-Host "Created $pextFile"

      - name: Upload .pext artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchDisplay-pext
          path: "SwitchDisplay.pext"
          retention-days: 30
